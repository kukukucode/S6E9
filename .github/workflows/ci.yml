name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-tested.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-tested.txt

      - name: Compile Python sources
        run: |
          python -m compileall -q \
            s6e9 \
            prototype.py \
            diversity.py \
            gpu_setup.py

      - name: Check undefined names
        run: ruff check --select F821 s6e9 prototype.py diversity.py gpu_setup.py

      - name: Run tests
        run: python -m pytest -q
